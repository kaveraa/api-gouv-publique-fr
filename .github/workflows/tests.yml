name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        include:
          - { laravel: '12.*', testbench: '^10.0' }
          - { laravel: '13.*', testbench: '^11.0' }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0', stability: prefer-lowest }
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - name: Run tests
        run: vendor/bin/pest

  core-only:
    name: Core without Laravel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install without Laravel
        run: |
          composer remove --dev orchestra/testbench pestphp/pest-plugin-laravel larastan/larastan --no-interaction --no-update
          composer update --prefer-dist --no-interaction
      - name: Check Laravel is absent
        run: test ! -d vendor/laravel/framework
      - name: Run core tests
        run: vendor/bin/pest tests/Unit

  quality:
    name: Style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pest --coverage --min=90

  # Single check for branch protection, so the required check name never changes with the matrix.
  all-checks:
    name: All checks
    runs-on: ubuntu-latest
    needs: [tests, core-only, quality, coverage]
    if: always()
    steps:
      - name: Fail when any job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job did not pass."
            exit 1
          fi
          echo "All jobs passed."
