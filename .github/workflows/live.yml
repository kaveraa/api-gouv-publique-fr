name: live

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - name: Run live contract tests
        run: vendor/bin/pest tests/Live
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issues=$(gh issue list --repo "${{ github.repository }}" --state open --search "Live API tests failed in:title" --json number,title --jq '[.[] | select(.title == "Live API tests failed")]')
          open=$(echo "$issues" | jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "Live API tests failed" \
              --body "The weekly live tests failed. An API may have changed. See $run_url"
          else
            number=$(echo "$issues" | jq '.[0].number')
            gh issue comment "$number" --repo "${{ github.repository }}" --body "The live tests failed again. See $run_url"
          fi
