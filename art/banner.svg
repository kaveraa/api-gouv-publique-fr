<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">api-gouv-publique-fr</title>
  <desc id="desc">Typed PHP client for French public APIs: company search, address search and a Laravel bridge. Unofficial.</desc>

  <rect width="1280" height="400" fill="#0b1f3a"/>

  <rect x="80" y="82" width="48" height="8" rx="4" fill="#3b82f6"/>
  <rect x="134" y="82" width="48" height="8" rx="4" fill="#f4f6fb"/>
  <rect x="188" y="82" width="48" height="8" rx="4" fill="#ef4444"/>

  <text x="80" y="176" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">api-gouv-publique-fr</text>
  <text x="80" y="226" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#b9c8e2">Typed PHP client for French public APIs</text>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#e6edf9">
    <rect x="80" y="262" width="180" height="44" rx="22" fill="#16325a" stroke="#2c4a7a"/>
    <text x="170" y="291" text-anchor="middle">Company search</text>
    <rect x="276" y="262" width="160" height="44" rx="22" fill="#16325a" stroke="#2c4a7a"/>
    <text x="356" y="291" text-anchor="middle">Address (BAN)</text>
    <rect x="452" y="262" width="104" height="44" rx="22" fill="#16325a" stroke="#2c4a7a"/>
    <text x="504" y="291" text-anchor="middle">Geo API</text>
    <rect x="572" y="262" width="170" height="44" rx="22" fill="#16325a" stroke="#2c4a7a"/>
    <text x="657" y="291" text-anchor="middle">Laravel bridge</text>
  </g>

  <rect x="772" y="96" width="428" height="208" rx="16" fill="#06111f" stroke="#2c4a7a"/>
  <circle cx="800" cy="124" r="6" fill="#ef4444"/>
  <circle cx="822" cy="124" r="6" fill="#f5b942"/>
  <circle cx="844" cy="124" r="6" fill="#3ecf8e"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" xml:space="preserve">
    <text x="796" y="170" fill="#e6edf9">$company = <tspan fill="#7cc4ff">ApiGouv</tspan>::<tspan fill="#f5b942">entreprises</tspan>()</text>
    <text x="796" y="198" fill="#e6edf9">    -&gt;<tspan fill="#f5b942">parSiren</tspan>(<tspan fill="#3ecf8e">'812487973'</tspan>);</text>
    <text x="796" y="242" fill="#e6edf9">echo $company-&gt;nomComplet;</text>
    <text x="796" y="270" fill="#7f93b3">// OCTO</text>
  </g>

  <text x="80" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#7f93b3">Unofficial project - not affiliated with the French State</text>
</svg>
